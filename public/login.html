<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ARTMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="menu">
        <a href="index.html" class="link-menu">HOME</a>
        <a href="galeria.html" class="link-menu">GALERIA</a>
        <a href="chat.html" class="link-menu">CHAT</a>
        <a href="cadastro.html" class="link-menu">CADASTRO</a>
        <a href="login.html" class="link-menu">LOGIN</a>
    </nav>

    <div class="loginContainer">

        <h2>Bem-vindo de volta!</h2>

        <form id="formLogin">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">ENTRAR</button>

        </form>

        <p id="mensagemLogin"></p>

        <p class="linkCadastro">
            Ainda não possui uma conta?
            <a href="cadastro.html">Cadastre-se</a>
        </p>

    </div>

    <footer>
        &copy; Desenvolvido por Tainá Vitória - 2026 Curitiba
    </footer>

    <script>

        const formLogin = document.querySelector('#formLogin');
        const mensagemLogin = document.querySelector('#mensagemLogin');

        formLogin.addEventListener('submit', async (evento) => {

            evento.preventDefault();

            const email = document.querySelector('#email').value.trim();
            const senha = document.querySelector('#senha').value;

            try {

                const respostaServidor = await fetch(
                    'http://localhost:5500/login',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            senha: senha
                        })
                    }
                );

                const dados = await respostaServidor.json();

                if (!respostaServidor.ok) {
                    mensagemLogin.textContent = dados.erro;
                    return;
                }

                mensagemLogin.textContent = dados.mensagem;

                formLogin.reset();

            } catch (erro) {

                mensagemLogin.textContent =
                    'Erro ao conectar com o servidor.';

            }

        });

    </script>

</body>

</html>
